name: Publish a release

# D-226, D-227 (S25): the pages are published with the repository's tracked files at one address, so that every
# relative link a page makes (to a record, a review entry, a query, a schema) opens the file it names. Only a commit
# tagged as a release (v*) is published, and only after every check passes on it; the published address is then
# checked against the same commit (tools/check_published.py) and with the five browser scripts. Run by hand from
# the Actions tab on the branch whose head is the tagged release commit (normally main). Pages' source must be
# "GitHub Actions" (the repository's settings, the human's).
#
# EN-3 (D-217): every action is pinned to the commit its release tag named, read from the action's own repository
# (`git ls-remote --tags`); checkout, setup-python and setup-node keep CI's pins.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Only a release commit is published (a v* tag on this commit)
        run: |
          tags="$(git tag --points-at HEAD --list 'v*')"
          if [ -z "$tags" ]; then echo "::error::$(git rev-parse --short HEAD) carries no v* tag: it is not a release" ; exit 1; fi
          echo "publishing $(git rev-parse --short HEAD), tagged: $tags"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Every check passes on the release commit, and every page equals its rebuild (D-213)
        run: |
          python -m pip install -r requirements-test.txt -r requirements-analysis.txt
          python tools/check_all.py
      - name: The published tree is the commit's tracked files
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/published"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/published

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}site/
    outputs:
      address: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_BASE_URL: ${{ needs.deploy.outputs.address }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: The address serves the commit's pages and every file they link to, byte for byte
        run: |
          for attempt in 1 2 3; do python tools/check_published.py "$QA_BASE_URL" && exit 0; sleep 30; done; exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the pinned Playwright and its browsers (D-212)
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: The published HBM page (Chromium)
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/hbm-chain" && node tests/browser/hbm-chain.qa.js "$RUNNER_TEMP/qa/hbm-chain"
      - name: The published research view (Chromium)
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/hbm-insight" && node tests/browser/hbm-insight.qa.js "$RUNNER_TEMP/qa/hbm-insight"
      - name: The 15 published journey pages (Chromium)
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/journeys" && node tests/browser/journeys.qa.js "$RUNNER_TEMP/qa/journeys"
      - name: The published client brief, screen and print (Chromium)
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/brief" && node tests/browser/brief.qa.js "$RUNNER_TEMP/qa/brief"
      - name: The published research view's filter in Chromium, Firefox and WebKit
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/filter" && node tests/browser/filter.qa.js "$RUNNER_TEMP/qa/filter"
      - name: Keep the screenshots and results of the published pages
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-qa
          path: ${{ runner.temp }}/qa
