name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies (D-026)
        run: python -m pip install -r requirements-test.txt
      - name: Install the pinned SQL engine (D-118)
        run: python -m pip install -r requirements-analysis.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository integrity (Gate 0)
        run: python tools/validate_repo.py
