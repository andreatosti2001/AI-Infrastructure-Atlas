name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# F-12 (S22.5, D-216; EN-3): every action is pinned to the commit its release tag named on 2026-10-15, with the release
# beside it; a tag can be moved to other code, a commit cannot. Moving to a newer release changes hash and comment
# together, both read from the action's own repository (`git ls-remote --tags`).

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies (D-026)
        run: python -m pip install -r requirements-test.txt
      - name: Install the pinned SQL engine (D-118)
        run: python -m pip install -r requirements-analysis.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository integrity (Gate 0)
        run: python tools/validate_repo.py

  # D-212 (S22 H-0; engineering audit F-1, F-11): the browser checks, with the Playwright pinned in package-lock.json and
  # its own browsers. Each script lists its failed conditions and exits non-zero; every step runs even after a failure.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the pinned Playwright (D-212)
        run: npm ci
      - name: Install Chromium, Firefox and WebKit for that Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: HBM page (Chromium)
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/hbm-chain" && node tests/browser/hbm-chain.qa.js "$RUNNER_TEMP/qa/hbm-chain"
      - name: Research view (Chromium)
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/hbm-insight" && node tests/browser/hbm-insight.qa.js "$RUNNER_TEMP/qa/hbm-insight"
      - name: Research journeys, 15 pages (Chromium)
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/journeys" && node tests/browser/journeys.qa.js "$RUNNER_TEMP/qa/journeys"
      - name: Client brief, screen and print (Chromium)
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/brief" && node tests/browser/brief.qa.js "$RUNNER_TEMP/qa/brief"
      - name: The research view's filter in Chromium, Firefox and WebKit (F-11)
        if: success() || failure()
        run: mkdir -p "$RUNNER_TEMP/qa/filter" && node tests/browser/filter.qa.js "$RUNNER_TEMP/qa/filter"
      - name: Keep the screenshots and results of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-qa
          path: ${{ runner.temp }}/qa
